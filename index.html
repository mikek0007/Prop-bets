<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#13203A">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Super Bowl Pool">
<title>Super Bowl Pool</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Big+Shoulders+Display:wght@700;800&display=swap">
<style>
:root{color-scheme:light;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: one narrow column, like a prop sheet taped to the fridge. Field-strip progress is the single flourish. */
:root{
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --body:"Barlow","Helvetica Neue",Arial,sans-serif;
  --bg:#EDF0EA; --surface:#FFFFFF; --ink:#13203A; --ink-2:#48546A; --line:#C9D1C6;
  --accent:#E8A700; --on-accent:#13203A; --accent-bg:#FBEFC8;
  --good:#1B7A4A; --on-good:#FFFFFF; --good-bg:#D8EEE1;
  --bad:#B8322A; --bad-bg:#F6D9D6;
  --focus:#2457D6;
  --turf:#2F7D52; --turf-lit:#5DB382; --hash:rgba(244,247,242,.4); --chalk:#F4F7F2; --ball:#8A4B24;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0B1120; --surface:#141C30; --ink:#E8ECF4; --ink-2:#A2ADC3; --line:#2A3553;
    --accent:#FFC83D; --on-accent:#0B1120; --accent-bg:#3A3112;
    --good:#4CCB8B; --on-good:#0B1120; --good-bg:#12362A;
    --bad:#FF8279; --bad-bg:#3E1D20;
    --focus:#8FB4FF;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1120; --surface:#141C30; --ink:#E8ECF4; --ink-2:#A2ADC3; --line:#2A3553;
  --accent:#FFC83D; --on-accent:#0B1120; --accent-bg:#3A3112;
  --good:#4CCB8B; --on-good:#0B1120; --good-bg:#12362A;
  --bad:#FF8279; --bad-bg:#3E1D20;
  --focus:#8FB4FF;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--body)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.page{max-width:640px;margin:0 auto;padding-block:20px 72px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mast{display:grid;gap:4px;margin-bottom:14px}
.eyebrow{font:600 12px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2)}
h1{margin:6px 0 2px;font:800 clamp(36px,10vw,56px)/.92 var(--display);text-transform:uppercase;letter-spacing:.01em;text-wrap:balance;overflow-wrap:anywhere}
.status{margin:0;color:var(--ink-2);font-size:15px}
.tabs{display:flex;gap:2px;border-bottom:2px solid var(--line);margin-bottom:18px;overflow-x:auto}
.tabs a{flex:none;padding:13px 14px;margin-bottom:-2px;border-bottom:4px solid transparent;color:var(--ink-2);text-decoration:none;font:700 18px/1 var(--display);text-transform:uppercase;letter-spacing:.05em}
.tabs a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
.stack{display:grid;gap:12px;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;min-width:0}
.note{background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:18px;color:var(--ink-2)}
.note p{margin:0}
.note strong{display:block;color:var(--ink);font:700 20px/1.1 var(--display);text-transform:uppercase;letter-spacing:.03em;margin-bottom:6px}
.banner{border-radius:10px;padding:12px 14px;background:var(--good-bg);color:var(--ink);display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.banner.info{background:var(--accent-bg)}
.banner.win{display:grid;gap:4px;background:var(--accent-bg);border:2px solid var(--accent);padding:16px}
.winname{font:800 clamp(30px,9vw,44px)/1 var(--display);text-transform:uppercase;overflow-wrap:anywhere}
label.lbl{display:grid;gap:6px;font-weight:600}
div.lbl{display:grid;gap:6px;font-weight:600}
label.lbl small,div.lbl small,.hint{font-weight:400;color:var(--ink-2);font-size:14px}
input[type="text"],input[type="number"],input[type="email"],input[type="tel"],input[type="datetime-local"],select,textarea{width:100%;min-height:46px;padding:10px 12px;font:inherit;color:var(--ink);background:var(--surface);border:2px solid var(--line);border-radius:8px}
textarea{resize:vertical;line-height:1.35}
input:disabled{opacity:.7}
.yard{--p:0;position:relative;height:30px;border-radius:6px;overflow:hidden;background-color:var(--turf);background-image:repeating-linear-gradient(90deg,var(--hash) 0 2px,transparent 2px 10%)}
.yard i{position:absolute;inset:0 auto 0 0;width:calc(12px + (100% - 24px) * var(--p));background:var(--turf-lit);opacity:.5;transition:width .25s}
.yard b{position:absolute;top:50%;left:calc(12px + (100% - 24px) * var(--p));width:24px;height:14px;border-radius:50%;background:var(--ball);transform:translate(-50%,-50%);transition:left .25s}
.yard b::after{content:"";position:absolute;left:5px;right:5px;top:50%;height:2px;background:var(--chalk);transform:translateY(-50%)}
.progress{display:grid;gap:6px}
.progress .count{font:700 15px/1 var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.q{display:grid;gap:10px}
.qhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.qn{font:800 18px/1 var(--display);letter-spacing:.06em;color:var(--ink-2)}
.pts-tag{font:700 14px/1 var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.qtext{margin:0;font-weight:600;font-size:18px;line-height:1.3;overflow-wrap:anywhere}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{position:relative;display:block}
.opt input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}
.opt span,.chip{display:inline-flex;align-items:center;min-height:46px;padding:8px 14px;border:2px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:600 16px/1.2 var(--body);cursor:pointer;overflow-wrap:anywhere}
.opt input:checked+span{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.opt input:focus-visible+span{outline:3px solid var(--focus);outline-offset:2px}
.opt input:disabled{cursor:default}
.chip[aria-pressed="true"]{background:var(--good);border-color:var(--good);color:var(--on-good)}
.btn{min-height:50px;padding:10px 20px;border:2px solid var(--accent);border-radius:8px;background:var(--accent);color:var(--on-accent);font:800 20px/1 var(--display);letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--ink)}
.btn.small{min-height:40px;padding:6px 14px;font-size:16px}
.submit{display:grid;gap:8px;justify-items:start}
.row{display:grid;grid-template-columns:52px minmax(0,1fr) auto;align-items:center;gap:10px;width:100%;padding:12px 14px;text-align:left;font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:10px;cursor:pointer}
.row.lead{background:var(--accent-bg);border-color:var(--accent)}
.rank{font:800 32px/1 var(--display);font-variant-numeric:tabular-nums}
.name{font-weight:600;font-size:18px;overflow-wrap:anywhere}
.pts{font:800 34px/1 var(--display);font-variant-numeric:tabular-nums;text-align:right}
.pts small{display:block;margin-top:2px;font:600 11px/1 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2)}
.detail{display:grid;gap:0;margin:-6px 0 4px;padding:4px 14px;background:var(--surface);border:1px solid var(--line);border-top:0;border-radius:0 0 10px 10px}
.prow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.prow:first-child{border-top:0}
.ptext{min-width:0;display:grid;gap:2px}
.pq{font-size:14px;color:var(--ink-2);overflow-wrap:anywhere}
.pa{font-weight:600;overflow-wrap:anywhere}
.tag{flex:none;padding:4px 8px;border-radius:6px;font:700 13px/1 var(--display);letter-spacing:.08em;text-transform:uppercase}
.tag.good{background:var(--good-bg);color:var(--good)}
.tag.bad{background:var(--bad-bg);color:var(--bad)}
.tag.wait{background:var(--bg);color:var(--ink-2);border:1px solid var(--line)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1 1 0;min-height:44px;padding:8px 10px;border:2px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:700 17px/1 var(--display);letter-spacing:.05em;text-transform:uppercase;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.toggle{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.toggle strong{font:800 22px/1 var(--display);text-transform:uppercase;letter-spacing:.03em}
.qedit{display:grid;gap:10px}
.qedit-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.qedit-tools{display:flex;gap:6px;flex-wrap:wrap}
.entry-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px}
.entry-row .name{font-size:17px}
.entry-row .hint{display:block}
.toast{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px));pointer-events:none}
.toast span{background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;box-shadow:0 2px 12px rgba(0,0,0,.25)}
.chatlist{display:grid;gap:8px;align-content:start;min-height:220px;max-height:min(58vh,520px);overflow-y:auto;padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.msg{display:grid;gap:2px;min-width:0;max-width:88%;justify-self:start;padding:8px 12px;border-radius:10px;background:var(--bg);border:1px solid var(--line)}
.msg.mine{justify-self:end;background:var(--accent-bg);border-color:var(--accent)}
.mhead{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.mname{font:700 15px/1 var(--display);letter-spacing:.06em;text-transform:uppercase}
.mtime{font-size:12px;color:var(--ink-2)}
.mtext{overflow-wrap:anywhere;white-space:pre-wrap}
.mdel{margin-left:auto;padding:4px 8px;border:1px solid var(--line);border-radius:6px;background:transparent;color:var(--ink-2);font:600 12px/1 var(--body);cursor:pointer}
.composer{display:grid;gap:8px}
.composer .send{display:flex;gap:8px}
.composer .send input{flex:1;min-width:0}
.dot{display:inline-block;width:8px;height:8px;margin-left:6px;border-radius:50%;background:var(--accent);vertical-align:middle}
.introtext{white-space:pre-wrap;font-size:17px;line-height:1.6;overflow-wrap:anywhere}
.btn.link{text-decoration:none;display:inline-flex;align-items:center}
.qrow{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:center}
.ico{display:inline-flex;flex:none;width:52px;height:52px}
.ico svg{display:block}
.o{stroke:var(--ink);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.ln{fill:none;stroke:var(--ink);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.scorepair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.urlhint{font-size:13px;color:var(--ink-2);overflow-wrap:anywhere;user-select:all}
.fame-hero{display:flex;flex-direction:column;align-items:center;gap:12px;justify-content:center;padding:14px;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.fame-hero img{display:block;width:auto;max-width:100%;max-height:440px;border-radius:6px}
.fame-row{display:grid;grid-template-columns:auto auto minmax(0,1fr) auto;align-items:center;gap:12px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.fame-row.lead{background:var(--accent-bg);border-color:var(--accent)}
.fame-row .yr{font:800 30px/1 var(--display);font-variant-numeric:tabular-nums;min-width:3.2ch}
.fame-row .name{overflow-wrap:anywhere}
.fame-end{display:flex;gap:8px;align-items:center}
.tag.gold{background:var(--accent-bg);color:var(--ink);border:1px solid var(--accent)}
.banner.win .btn{justify-self:start}
a.linkbtn{display:inline-block}
@media (max-width:440px){.tabs a{padding:12px 9px;font-size:16px;letter-spacing:.02em}.seg button,.seg a{font-size:15px;padding:8px 6px}}
.foot{margin-top:32px;text-align:center}
.linkbtn{background:none;border:0;color:var(--ink-2);font:inherit;font-size:13px;text-decoration:underline;padding:12px;cursor:pointer}
.qphoto{display:block;width:100%;max-height:260px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.filebtn{position:relative;display:inline-flex;align-items:center;overflow:hidden;cursor:pointer}
.filebtn input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0}
.avatar{flex:none;width:56px;height:56px;padding:0;border-radius:50%;overflow:hidden;border:2px solid var(--line);background:var(--bg);display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.avatar.plain{cursor:default}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.avatar .ico,.avatar .ico svg{width:42px;height:42px}
.fame-item{display:grid;gap:6px}
.fame-tools{padding:0 4px}
.fame-res{display:grid;gap:8px;margin:2px 0 6px}
.lightbox{position:fixed;inset:0;z-index:50;display:grid;place-content:center;justify-items:center;gap:14px;padding:20px;background:rgba(8,12,22,.9)}
.lightbox img{max-width:100%;max-height:68vh;border-radius:10px}
.lightbox .cap{color:#fff;font:800 26px/1.1 var(--display);text-transform:uppercase;text-align:center}
.bar{height:10px;border-radius:6px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink-2)}
.bar.good i{background:var(--good)}
.names{font-size:14px;color:var(--ink-2);overflow-wrap:anywhere}
.seg a{flex:1 1 0;display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:8px 10px;border:2px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:700 17px/1 var(--display);letter-spacing:.05em;text-transform:uppercase;text-decoration:none}
.yard b.ic{width:26px;height:26px;border-radius:0;background:none}
.yard b.ic::after{display:none}
.yard b.ic svg{display:block;width:26px;height:26px}
.swatch{width:44px;height:44px;padding:0;border-radius:50%;border:3px solid var(--line);cursor:pointer}
.swatch[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 3px var(--surface)}
.iconpick{display:inline-flex;width:48px;height:48px;padding:6px;border:2px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer}
.iconpick[aria-pressed="true"]{border-color:var(--ink);background:var(--accent-bg)}
.iconpick svg{width:100%;height:100%}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.mini{flex:none;width:34px;height:34px;border-radius:50%;object-fit:cover;border:1px solid var(--line);background:var(--accent-bg);display:inline-flex;align-items:center;justify-content:center;font:800 15px/1 var(--display);color:var(--ink);text-transform:uppercase}
.mini.sm{width:24px;height:24px;font-size:12px}
.mini.big{width:56px;height:56px;font-size:22px}
.fame-row.tap{cursor:pointer}
.chev{color:var(--ink-2);font-size:18px;line-height:1}
.wtext{display:grid;gap:3px;min-width:0}
.badges{display:flex;flex-wrap:wrap;gap:4px}
.bdg{display:inline-flex;flex:none}
.bdg svg{display:block}
.scard{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:center}
.scard .t{font:800 20px/1.1 var(--display);text-transform:uppercase;letter-spacing:.03em}
.scard p{margin:3px 0 0;color:var(--ink-2);overflow-wrap:anywhere}
.scard.fire{background:var(--bad-bg);border-color:var(--bad)}
.chart{display:block;width:100%;height:auto;overflow:visible}
.chart text{font:600 10px var(--body);fill:var(--ink-2)}
.chip.sm{min-height:36px;padding:4px 10px;font-size:14px}
.bprow{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.bprow:first-child{border-top:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

  /* ---------- leaderboard ---------- */

  function byQuestion(rows) {
    var list = qs();

    if (!bqId || !list.some(function (x) { return x.id === bqId; })) bqId = list[0].id;

      list.map(function (x, i) { return h('option', { value: x.id, text: 'Q' + (i + 1) + ': ' + String(x.text).slice(0, 70) }); }));
    sel.value = bqId;
    box.append(sel);
    var a = answerOf(q);
    var total = rows.length;
    opts(q).forEach(function (o, oi) {
      var who = rows.filter(function (r) { return r.e.picks && r.e.picks[q.id] === oi; })
        .map(function (r) { return r.e.name || 'Unnamed'; }).sort(function (x, y) { return x.localeCompare(y); });

        h('div', { class: 'toggle' },
          h('strong', { class: 'name', text: o }),
          h('span', { class: 'qedit-tools' },
            a === oi ? h('span', { class: 'tag good', text: 'Correct' }) : null,
            h('span', { class: 'pts-tag', text: who.length + ' · ' + pct + '%' }))),
        h('div', { class: 'bar' + (a === oi ? ' good' : '') }, h('i', { style: 'width:' + pct + '%' })),
        h('div', { class: 'names', text: who.length ? who.join(', ') : 'Nobody' })));
    });
    var none = rows.filter(function (r) { return !(r.e.picks && Number.isInteger(r.e.picks[q.id])); }).length;
    if (none) box.append(h('p', { class: 'hint', text: none + (none === 1 ? ' entry has no pick.' : ' entries have no pick.') }));
    if (a === null) box.append(h('p', { class: 'hint', text: 'The answer has not been marked yet.' }));
    return box;
  }

  /* ---------- game story ---------- */

  function ord(n) { var t = ['th', 'st', 'nd', 'rd'], v = n % 100; return n + (t[(v - 20) % 10] || t[v] || t[0]); }
  function fmtDur(ms) {
    var m = Math.round(ms / 60000);
    if (m < 1) return 'under a minute';
    if (m < 60) return m + ' min';
    var hh = Math.floor(m / 60), mm = m % 60;
    return hh + ' hr' + (mm ? ' ' + mm + ' min' : '');
  }
  function joinNames(ids, names) {
    var a = ids.map(function (id) { return names[id]; });
    return a.length > 2 ? a.slice(0, -1).join(', ') + ' and ' + a[a.length - 1] : a.join(' and ');
  }
  function computeStory(ctx) {
    var Q = ctx.qs, E = ctx.entries, n = E.length;
    var names = {}, qIndex = {}, ids = [];
    E.forEach(function (e) { names[e.id] = e.name || 'Unnamed'; ids.push(e.id); });
    Q.forEach(function (q) { qIndex[q.id] = q; });
    var out = { names: names, badges: {}, cards: [], steps: [], order: [], scored: 0, n: n, partial: false };
    function give(id, key, why) { (out.badges[id] = out.badges[id] || []).push({ key: key, why: why }); }
    function qNum(qid) { for (var i = 0; i < Q.length; i++) if (Q[i].id === qid) return i + 1; return 0; }
    function pq(q) { return Number(q.points) || 1; }
    function card(icon, title, text, fire) { out.cards.push({ icon: icon, title: title, text: text, fire: !!fire }); }

    // Hall of Fame badges work even before any scoring
    var wins = {}, lastYear = {}, maxWins = 0;
    arr(ctx.fame).forEach(function (w) {
      var k = String(w.name || '').trim().toLowerCase();
      if (!k) return;
      wins[k] = (wins[k] || 0) + 1;
      if (Number(w.year) === ctx.thisYear - 1) lastYear[k] = true;
    });
    Object.keys(wins).forEach(function (k) { maxWins = Math.max(maxWins, wins[k]); });
    var goats = [];
    if (maxWins >= 2) E.forEach(function (e) {
      if (wins[String(e.name || '').trim().toLowerCase()] === maxWins) { goats.push(e.id); give(e.id, 'goat', maxWins + ' Hall of Fame wins, the most of anyone'); }
    });

    // replay the scoring, one marked answer at a time
    var marks = arr(ctx.marks).filter(function (m) { return qIndex[m.q]; })
      .sort(function (a, b) { return String(a.k) < String(b.k) ? -1 : 1; });
    var cur = {}, inMarks = {}, order = [], steps = [];
    marks.forEach(function (m) { inMarks[m.q] = true; });
    Q.forEach(function (q) {
      var a = ctx.answers[q.id];
      if (!inMarks[q.id] && Number.isInteger(a)) { cur[q.id] = a; order.push(q.id); out.partial = true; }
    });
    function snap(t, qid) {
      var pts = {}, ranks = {}, mx = 0;
      E.forEach(function (e) {
        var pp = 0;
        Q.forEach(function (q) { if (Number.isInteger(cur[q.id]) && e.picks && e.picks[q.id] === cur[q.id]) pp += pq(q); });
        pts[e.id] = pp; if (pp > mx) mx = pp;
      });
      E.forEach(function (e) { var r = 1; E.forEach(function (o) { if (pts[o.id] > pts[e.id]) r++; }); ranks[e.id] = r; });
      steps.push({ t: t, q: qid, pts: pts, ranks: ranks, max: mx });
    }
    snap(marks.length ? marks[0].t : 0, null);
    marks.forEach(function (m) {
      order = order.filter(function (x) { return x !== m.q; });
      if (Number.isInteger(m.a)) { cur[m.q] = m.a; order.push(m.q); } else delete cur[m.q];
      snap(m.t, m.q);
    });
    out.steps = steps; out.order = order; out.scored = order.length; out.cur = cur;
    if (!order.length || n < 2) {
      if (goats.length && order.length) card('goat', 'GOAT', joinNames(goats, names) + ' has the most Hall of Fame wins (' + maxWins + ').');
      return out;
    }
    var fin = steps[steps.length - 1], pts = fin.pts;
    var hi = Math.max.apply(null, ids.map(function (id) { return pts[id]; }));
    var lo = Math.min.apply(null, ids.map(function (id) { return pts[id]; }));

    // Trash Can Fire: the lowest score
    var bottomCount = {}, scoringSteps = steps.filter(function (st) { return st.max > 0; });
    ids.forEach(function (id) { bottomCount[id] = 0; });
    scoringSteps.forEach(function (st) {
      var mn = Math.min.apply(null, ids.map(function (id) { return st.pts[id]; }));
      if (mn < st.max) ids.forEach(function (id) { if (st.pts[id] === mn) bottomCount[id]++; });
    });
    if (n >= 3 && hi > lo && hi > 0) {
      var low = ids.filter(function (id) { return pts[id] === lo; });
      low.forEach(function (id) { give(id, 'trash', lo + (lo === 1 ? ' point' : ' points') + ', the lowest in the pool'); });
      var worstLong = Math.max.apply(null, ids.map(function (id) { return bottomCount[id]; }));
      var longest = ids.filter(function (id) { return bottomCount[id] === worstLong; });
      var txt = joinNames(low, names) + ' ' + (low.length > 1 ? 'are' : 'is') + ' at the bottom with ' + lo + (lo === 1 ? ' point.' : ' points.');
      if (worstLong >= 2) txt += ' ' + joinNames(longest, names) + ' spent the most time in last place (' + worstLong + ' of ' + scoringSteps.length + ' answers).';
      card('trash', 'Trash Can Fire', txt, true);
    }

    // time in the lead and lead changes
    var leadSteps = {}, leadMs = {}, lastKey = null, changes = 0;
    ids.forEach(function (id) { leadSteps[id] = 0; leadMs[id] = 0; });
    steps.forEach(function (st, i) {
      if (st.max <= 0) return;
      var leaders = ids.filter(function (id) { return st.pts[id] === st.max; });
      var key = leaders.slice().sort().join('|');
      if (lastKey !== null && key !== lastKey) changes++;
      lastKey = key;
      var next = steps[i + 1];
      var dur = next ? Math.max(0, next.t - st.t) : 0;
      leaders.forEach(function (id) { leadSteps[id]++; leadMs[id] += dur; });
    });
    var totalMs = ids.reduce(function (a, id) { return a + leadMs[id]; }, 0);
    var key2 = totalMs > 0 ? leadMs : leadSteps;
    var bestLead = Math.max.apply(null, ids.map(function (id) { return key2[id]; }));
    if (bestLead > 0) {
      var leaders2 = ids.filter(function (id) { return key2[id] === bestLead; });
      card('trophy', 'Most time in the lead',
        joinNames(leaders2, names) + ' led after ' + leadSteps[leaders2[0]] + ' of ' + scoringSteps.length + ' scored answers' +
        (totalMs > 0 ? ', about ' + fmtDur(leadMs[leaders2[0]]) + ' on top.' : '.'));
    }
    if (scoringSteps.length >= 2) {
      card('coin', 'Lead changes', changes ? 'The lead changed hands ' + changes + (changes === 1 ? ' time.' : ' times.') : 'Nobody ever took the lead from the first leader.');
    }

    // biggest climb and drop over a single answer
    var up = { d: 0 }, dn = { d: 0 };
    for (var i = 1; i < steps.length; i++) {
      (function (prev, st) {
        if (prev.max <= 0 && st.max <= 0) return;
        ids.forEach(function (id) {
          var d = prev.ranks[id] - st.ranks[id];
          if (d > up.d) up = { d: d, id: id, from: prev.ranks[id], to: st.ranks[id], q: st.q };
          if (-d > dn.d) dn = { d: -d, id: id, from: prev.ranks[id], to: st.ranks[id], q: st.q };
        });
      })(steps[i - 1], steps[i]);
    }
    if (up.d >= 2) {
      give(up.id, 'rocket', 'Jumped from ' + ord(up.from) + ' to ' + ord(up.to) + ' after Q' + qNum(up.q));
      card('rocket', 'Biggest climb', names[up.id] + ' jumped from ' + ord(up.from) + ' to ' + ord(up.to) + ' after Q' + qNum(up.q) + '.');
    }
    if (dn.d >= 2) {
      give(dn.id, 'dive', 'Fell from ' + ord(dn.from) + ' to ' + ord(dn.to) + ' after Q' + qNum(dn.q));
      card('dive', 'Biggest drop', names[dn.id] + ' fell from ' + ord(dn.from) + ' to ' + ord(dn.to) + ' after Q' + qNum(dn.q) + '.');
    }

    // streaks
    var hot = {}, cold = {};
    ids.forEach(function (id) {
      var e = E.find(function (x) { return x.id === id; });
      var run = 0, runC = 0, best = 0, bestC = 0;
      order.forEach(function (qid) {
        if (e.picks && e.picks[qid] === cur[qid]) { run++; runC = 0; } else { runC++; run = 0; }
        if (run > best) best = run; if (runC > bestC) bestC = runC;
      });
      hot[id] = best; cold[id] = bestC;
    });
    var hotMax = Math.max.apply(null, ids.map(function (id) { return hot[id]; }));
    if (hotMax >= 3) {
      var hs = ids.filter(function (id) { return hot[id] === hotMax; });
      hs.forEach(function (id) { give(id, 'hot', hotMax + ' correct answers in a row'); });
      card('hot', 'Hot streak', joinNames(hs, names) + ' got ' + hotMax + ' in a row.');
    }
    var coldMax = Math.max.apply(null, ids.map(function (id) { return cold[id]; }));
    if (coldMax >= 3) {
      var cs = ids.filter(function (id) { return cold[id] === coldMax; });
      cs.forEach(function (id) { give(id, 'ice', coldMax + ' misses in a row'); });
      card('ice', 'Ice cold', joinNames(cs, names) + ' missed ' + coldMax + ' in a row.');
    }

    // per question: lone wolf, the trap, crowd, crystal ball
    var wolfCount = {}, crystalCount = {}, crowdRight = 0, crowdTotal = 0, trap = null;
    ids.forEach(function (id) { wolfCount[id] = 0; crystalCount[id] = 0; });
    order.forEach(function (qid) {

      var counts = opts2.map(function () { return 0; });
      E.forEach(function (e) { var pk = e.picks && e.picks[qid]; if (Number.isInteger(pk) && counts[pk] != null) counts[pk]++; });

      }
    });
    var wolves = ids.filter(function (id) { return wolfCount[id] > 0; });
    if (wolves.length) {
      wolves.forEach(function (id) { give(id, 'wolf', 'The only one to get ' + wolfCount[id] + (wolfCount[id] === 1 ? ' question' : ' questions') + ' right'); });
      card('wolf', 'Lone wolf', wolves.map(function (id) { return names[id] + ' (' + wolfCount[id] + ')'; }).join(', ') + ' got a question right that nobody else did.');
    }
    if (trap) {
      card('flag', 'The trap', 'Q' + qNum(trap.qid) + ' fooled the pool: only ' + trap.right + ' of ' + n + ' got it.' + (trap.wrong ? ' Most picked "' + trap.wrong + '".' : ''));
    }
    if (crowdTotal >= 3) card('bubble', 'Crowd favorite', "The pool's top pick was right on " + crowdRight + ' of ' + crowdTotal + ' questions.');
    var cMax = Math.max.apply(null, ids.map(function (id) { return crystalCount[id]; }));
    if (cMax >= 2) {
      var cb = ids.filter(function (id) { return crystalCount[id] === cMax; });
      cb.forEach(function (id) { give(id, 'crystal', cMax + ' right answers that few others picked'); });
      card('crystal', 'Crystal ball', joinNames(cb, names) + ' called ' + cMax + ' answers that few others saw coming.');
    }

    // the finish
    var sorted = ids.map(function (id) { return pts[id]; }).sort(function (a, b) { return b - a; });
    var gap = sorted[0] - sorted[1];
    var winners = ctx.final ? arr(ctx.winners) : [];
    if (ctx.final && winners.length) {
      var wpts = pts[winners[0]];
      var near = ids.filter(function (id) { return winners.indexOf(id) < 0 && pts[id] === wpts; });
      near.forEach(function (id) { give(id, 'heart', 'Tied for first on points and lost on the tiebreaker'); });
      card('watch', 'Closest race', gap === 0 && near.length
        ? joinNames(winners, names) + ' won on the tiebreaker after tying at ' + wpts + ' points.'

      if (near.length) card('heart', 'Heartbreaker', joinNames(near, names) + ' tied for first on points and lost on the tiebreaker.');
      var possible = Q.reduce(function (a, q) { return a + pq(q); }, 0);
      var perfect = ids.filter(function (id) { return order.length === Q.length && pts[id] === possible; });
      perfect.forEach(function (id) { give(id, 'perfect', 'Every answer right'); });
      if (perfect.length) card('perfect', 'Perfect game', joinNames(perfect, names) + ' got every answer right.');
      winners.forEach(function (id) {
        var worst = 1, worstQ = null;

      });
      var wire = winners.filter(function (id) { return (out.badges[id] || []).some(function (b) { return b.key === 'wire'; }); });
      var came = winners.filter(function (id) { return (out.badges[id] || []).some(function (b) { return b.key === 'comeback'; }); });

      if (came.length) card('comeback', 'Comeback kid', came.map(function (id) { var b = out.badges[id].find(function (x) { return x.key === 'comeback'; }); return names[id] + ': ' + b.why.charAt(0).toLowerCase() + b.why.slice(1) + '.'; }).join(' '));

  function rankChart(st) {

    function xs(i) { return L + (steps.length > 1 ? (W - L - R) * i / (steps.length - 1) : (W - L - R) / 2); }
    function ys(r) { return T + (N > 1 ? (H - T - B) * (r - 1) / (N - 1) : 0); }
    var last = steps[steps.length - 1];
    var byFinal = ids.slice().sort(function (a, b) { return last.ranks[a] - last.ranks[b] || String(st.names[a]).localeCompare(String(st.names[b])); });
    var palette = ['#E8A700', '#2457D6', '#B8322A'];
    var color = {};
    if (storyHi && st.names[storyHi]) color[storyHi] = 'var(--ink)';
    else byFinal.slice(0, 3).forEach(function (id, i) { color[id] = palette[i]; });
    var svg = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Chart of everyone\'s place after each scored answer">';
    [1, Math.ceil(N / 2), N].filter(function (v, i, a) { return a.indexOf(v) === i; }).forEach(function (r) {
      svg += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + ys(r) + '" y2="' + ys(r) + '" style="stroke:var(--line);stroke-width:1"/><text x="' + (L - 6) + '" y="' + (ys(r) + 3) + '" text-anchor="end">' + ord(r) + '</text>';
    });
    svg += '<text x="' + L + '" y="' + (H - 6) + '">Start</text><text x="' + (W - R) + '" y="' + (H - 6) + '" text-anchor="end">Latest</text>';
    function line(id, col, wdt) {
      var pts2 = steps.map(function (s2, i) { return xs(i).toFixed(1) + ',' + ys(s2.ranks[id]).toFixed(1); }).join(' ');
      var dots = col.indexOf('var(--line)') === 0 ? '' : steps.map(function (s2, i) { return '<circle cx="' + xs(i).toFixed(1) + '" cy="' + ys(s2.ranks[id]).toFixed(1) + '" r="2.4" style="fill:' + col + '"/>'; }).join('');
      return '<polyline points="' + pts2 + '" style="fill:none;stroke:' + col + ';stroke-width:' + wdt + ';stroke-linejoin:round;stroke-linecap:round"/>' + dots;
    }
    ids.forEach(function (id) { if (!color[id]) svg += line(id, 'var(--line)', 1.5); });
    ids.forEach(function (id) { if (color[id]) svg += line(id, color[id], 3); });
    svg += '</svg>';
    var wrap = h('div', { class: 'card stack' },
      h('div', { class: 'lbl' }, 'How the standings moved', h('small', { text: 'Each step is one scored answer. Higher is better. Tap a name to follow one person.' })));
    var holder = h('div'); holder.innerHTML = svg; wrap.append(holder);
    wrap.append(h('div', { class: 'qedit-tools' }, byFinal.map(function (id) {

        onclick: function () { storyHi = on ? null : id; render(); } });
    })));
    return wrap;
  }

      if (canEdit) {
        tools.push(fileBtn(w.photo ? 'Change photo' : 'Add photo', function (f) { setWinnerPhoto(w.id, f); }));
        if (w.photo) tools.push(h('button', { class: 'btn ghost small', type: 'button', text: 'Remove photo', onclick: function () { removeWinnerPhoto(w.id); } }));
        tools.push(h('button', { class: 'btn ghost small', type: 'button', text: confirming ? 'Confirm' : 'Remove', onclick: function () {
          if (!confirming) {
            confirmId = key; clearTimeout(confirmTimer);
            confirmTimer = setTimeout(function () { confirmId = null; render(); }, 4000);
            render(); return;
          }
          confirmId = null;
          db.doc('hofResults/' + w.id).delete().then(null, function () {});
          db.doc('hof/' + w.id).delete().then(function () { toast('Winner removed'); }, function () { toast("Couldn't remove that winner."); });
          render();
        } }));
      }
      if (tools.length) item.append(h('div', { class: 'qedit-tools fame-tools' }, tools));
      if (open) item.append(fameResults(w));
      root.append(item);
    });
    if (canEdit) {
      root.append(h('form', { class: 'card stack', onsubmit: function (ev) { ev.preventDefault(); addFame(); } },
        h('div', { class: 'lbl', text: 'Add a winner' }),
        h('div', { class: 'scorepair' },
          h('label', { class: 'lbl', for: 'fame-year' }, 'Year',
            h('input', { type: 'number', id: 'fame-year', inputMode: 'numeric', min: '1960', max: '2200', value: fameForm.year,
              oninput: function (ev) { fameForm.year = ev.target.value; } })),
          h('label', { class: 'lbl', for: 'fame-name' }, 'Winner',
            h('input', { type: 'text', id: 'fame-name', maxLength: 60, value: fameForm.name,
              oninput: function (ev) { fameForm.name = ev.target.value; } }))),
        h('div', { class: 'qedit-tools' },
          fileBtn(fameForm.photo ? 'Change photo' : 'Add photo (optional)', async function (f) {
            try { fameForm.photo = await fileToDataUrl(f, 360, 90000); render(); } catch (e) { badPhoto(); }
          }),
          fameForm.photo ? h('span', { class: 'avatar plain' }, h('img', { src: fameForm.photo, alt: 'Chosen photo' })) : null),
        h('div', { class: 'submit' }, h('button', { class: 'btn', type: 'submit', text: 'Add winner' }))));
    }
    return root;
  }

  /* ---------- boot ---------- */

  addEventListener('hashchange', function () { readHash(); render(); });
  readHash();
  render();

  var HOST_EMAIL_L = String(HOST_EMAIL).toLowerCase();
  var configured = FIREBASE_CONFIG.apiKey.indexOf('PASTE') !== 0;
  var auth = null;
  var $foot = document.getElementById('foot');

  function renderFoot() {
    if (!configured || !auth) { $foot.replaceChildren(); return; }
    var items = [];
    items.push(canEdit
      ? h('button', { class: 'linkbtn', type: 'button', text: 'Host: sign out', onclick: hostSignOut })
      : h('button', { class: 'linkbtn', type: 'button', text: 'Host sign in', onclick: hostSignIn }));
    $foot.replaceChildren.apply($foot, items);
  }
  function emailKey(e) { return String(e || '').toLowerCase().replace(/\./g, ','); }
  async function resolveHost(u) {
    if (!u) return false;
    try { var s = await rootDb.doc('hostSessions/' + u.uid).get(); return s.exists; } catch (e) { return false; }
  }
  async function hostSignIn() {
    if (!auth || !auth.currentUser) { toast('Still connecting. Try again in a moment.'); return; }
    var pw = window.prompt('Host password');
    if (pw === null || pw === '') return;
    try {
      await rootDb.doc('hostSessions/' + auth.currentUser.uid).set(pw);
      await applyUser(auth.currentUser);
      toast('Signed in as host');
    } catch (e) {
      toast('Wrong password.');
    }
  }
  async function hostSignOut() {
    try { await rootDb.doc('hostSessions/' + auth.currentUser.uid).delete(); } catch (e) { toast("Couldn't sign out. Check your connection and try again."); return; }
    hostSubs = false; contactSubs = false; contactMap = {}; legacyFame = undefined;
    poolList = []; versionList = []; poolsLoaded = false;
    await applyUser(auth.currentUser);
  }
  function startPoolHostSubs() {
    if (contactSubs || !db || !pid) return;
    contactSubs = true;
    db.collection('contacts').onSnapshot(function (s) {
      contactMap = {};
      s.docs.forEach(function (d) { contactMap[d.id] = d.data(); });
      renderSoon();
    }, function () {});
  }
  function loadMyContact() {
    var id = guestId || uid;
    if (!id || !db || !pid || contactLoadedFor === id || draft.contactTouched) return;
    contactLoadedFor = id;
    db.doc('contacts/' + id).get().then(function (s) {
      if (s.exists && !draft.contactTouched) {
        var c = s.data() || {}, lg = c.contact || '';
        draft.fullName = c.fullName || '';
        draft.email = c.email || (lg.indexOf('@') >= 0 ? lg : '');
        draft.phone = c.phone || (lg && lg.indexOf('@') < 0 ? lg : '');
        renderSoon();
      }
    }, function () {});
  }
  async function applyUser(u) {
    uid = u ? u.uid : null;
    var host = await resolveHost(u);
    isMaster = false;
    isOwner = canEdit = host;
    canWrite = true;
    if (host) { startHostSubs(); startPoolHostSubs(); }
    loadMyContact();
    readHash();
    syncDraft();
    render();
    renderFoot();
  }

  (function init() {
    readHash();
    if (!configured) { render(); return; }
    var fbApp = initializeApp(FIREBASE_CONFIG);
    auth = getAuth(fbApp);
    var rtdb = getDatabase(fbApp);
    rootDb = makeDb(rtdb, '');
    db = makeDb(rtdb, pid ? 'pools/' + pid + '/' : '');
    onAuthStateChanged(auth, function (u) {
      if (!u) {
        signInAnonymously(auth).catch(function () { toast("Couldn't connect. Check your internet and reload."); });
        return;
      }
      applyUser(u);
    });

    if (!pid) return;

    function onErr(e) {
      dbError = (e && e.code) || 'unavailable';
      loaded.game = loaded.results = loaded.entries = true;
      render();
    }
    db.doc('config/game').onSnapshot(function (s) {
      game = s.exists ? s.data() : null;
      loaded.game = true;
      scheduleLock();
      if (edit && !edit.dirty) edit = null;
      renderSoon();
    }, onErr);
    db.doc('config/results').onSnapshot(function (s) {
      resultsExists = s.exists;
      results = s.exists ? s.data() : {};
      loaded.results = true;
      renderSoon();
    }, onErr);
    db.collection('entries').onSnapshot(function (s) {
      entries = s.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); });
      loaded.entries = true;
      syncDraft();
      renderSoon();
    }, onErr);
    render();
    db.collection('hof').onSnapshot(function (s) {
      fameList = s.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); });
      fameLoaded = true;
      renderSoon();
    }, function () { fameLoaded = true; renderSoon(); });
    db.collection('marks').onSnapshot(function (s) {
      marksList = s.docs.map(function (d) { return Object.assign({ k: d.id }, d.data()); });
      renderSoon();
    }, function () {});
    db.collection('qimg').onSnapshot(function (s) {
      qimgs = {};
      s.docs.forEach(function (d) { var v = d.data(); if (v && v.img) qimgs[d.id] = v.img; });
      renderSoon();
    }, function () {});
    db.doc('config/trophy').onSnapshot(function (s) {
      var v = s.exists ? s.data() : null;
      trophy = v && v.img ? v.img : null;
      renderSoon();
    }, function () {});
    db.doc('config/intro').onSnapshot(function (s) {
      intro = s.exists ? s.data() : null;
      loaded.intro = true;
      renderSoon();
    }, function () { loaded.intro = true; renderSoon(); });
    db.collection('chat').orderBy('ts', 'desc').limit(150).onSnapshot(function (s) {
      chat = s.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); }).reverse();
      loaded.chat = true;
      renderTabs();
      paintChat(false);
    }, function () { loaded.chat = true; paintChat(false); });
    setTimeout(function () {
      if (!(loaded.game && loaded.entries)) { timedOut = true; render(); }
    }, 10000);
  })();
})();
</script>
</body>
</html>
